services:
  mongo:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PSWRD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - quest_mongo:/data/db
    networks:
      - app_network

volumes:
  quest_mongo:
    name: 
      quest_mongo

networks:
  app_network:
    driver: bridge