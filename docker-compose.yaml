services:
  mongo:
    image: mongo:latest
    restart: always
    env_file: "./mongo/.mongo.env"
    ports:
      - "27017:27017"
    volumes:
      - quest_mongo:/data/db
    networks:
      - app_network

  redis:
    build:
      context: ./storage
      dockerfile: Dockerfile.redis
    restart: always
    env_file: "./storage/.storage.env"
    ports:
      - "6379:6379"
    volumes:
      - quest_redis:/data
    networks:
      - app_network

volumes:
  quest_mongo:
    name: 
      quest_mongo
    driver: local
  quest_redis:
    name: 
      quest_redis
    driver: local

networks:
  app_network:
    driver: bridge